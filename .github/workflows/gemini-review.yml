name: Gemini Code Review

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

# Modelo Gemini configurable. Override desde repo Settings → Secrets and
# variables → Actions → Variables: setear `GEMINI_MODEL`.
#
# IMPORTANTE: NO todos los modelos están en el free tier. La cuenta del
# proyecto (la owner del GEMINI_API_KEY) determina qué modelos pueden
# usarse gratis:
#   - gemini-2.5-flash       ← default actual: free tier ~250 RPD
#   - gemini-2.5-flash-lite  ← más bajo, ~20 RPD
#   - gemini-2.5-pro         ← REQUIERE billing/paid tier; free tier = 0
#
# Si activas billing en Google AI Studio para el API key de este repo,
# poné `vars.GEMINI_MODEL = gemini-2.5-pro` y vas a tener mejores reviews.
env:
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

jobs:
  review:
    name: Gemini Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr_diff.txt
          # Truncate to ~100K chars to stay within Gemini context limits
          head -c 100000 /tmp/pr_diff.txt > /tmp/pr_diff_trimmed.txt
          DIFF_SIZE=$(wc -c < /tmp/pr_diff.txt)
          echo "diff_size=$DIFF_SIZE" >> "$GITHUB_OUTPUT"
          if [ "$DIFF_SIZE" -gt 100000 ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Gemini API
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # PR title y body se pasan vía env para evitar bash injection
          # cuando contienen comillas, backticks o caracteres especiales.
          # Ej: un title `feat: "Cambio de Servicio"` rompía el script al
          # interpolarse directo en `PR_TITLE="${{ ... }}"`.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DIFF_TRUNCATED: ${{ steps.diff.outputs.truncated }}
          DIFF_SIZE: ${{ steps.diff.outputs.diff_size }}
        run: |
          # Verify API key is set
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set"
            exit 1
          fi
          echo "API key length: ${#GEMINI_API_KEY} chars"
          echo "Using model: ${GEMINI_MODEL}"

          TRUNCATION_NOTE=""
          if [ "$DIFF_TRUNCATED" = "true" ]; then
            TRUNCATION_NOTE="NOTE: The diff was truncated to 100K characters. Full diff is ${DIFF_SIZE} bytes."
          fi

          DIFF_CONTENT=$(cat /tmp/pr_diff_trimmed.txt)

          # Use jq to properly escape the content into JSON
          jq -n \
            --arg system "You are the code auditor for Compras Express Cargo (CEC), a Rails 8 + Hotwire + Tailwind CSS 4 cargo/shipping logistics system.

          Review the PR diff and check for:
          1. **Security**: SQL injection, XSS, CSRF, mass assignment, auth bypass
          2. **Rails conventions**: Follow Rails 8 patterns, proper use of Hotwire/Turbo
          3. **Performance**: N+1 queries, missing indexes, inefficient scopes
          4. **Test coverage**: Missing test cases, edge cases
          5. **Architecture**: Separation of concerns, proper patterns
          6. **Bugs**: Logic errors, missing validations, edge cases

          Format: Use bullet points grouped by file or topic. Rate severity:
          - 🔴 Critical — must fix before merge
          - 🟡 Warning — should fix
          - 🟢 Suggestion — nice to have

          End with: APPROVED ✅ or CHANGES REQUESTED ❌ with specific items.

          Keep the review concise and actionable. Skip boilerplate/generated files (Gemfile.lock, schema.rb, error pages, .keep files). Focus on custom code." \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg note "$TRUNCATION_NOTE" \
            --arg diff "$DIFF_CONTENT" \
            '{
              system_instruction: { parts: [{ text: $system }] },
              contents: [{ parts: [{ text: ("Review this Pull Request:\n\n**Title:** " + $title + "\n\n**Description:**\n" + $body + "\n\n" + $note + "\n\n**Diff:**\n```diff\n" + $diff + "\n```") }] }],
              generationConfig: { temperature: 0.3, maxOutputTokens: 8192 }
            }' > /tmp/request.json

          # Cuerpo y código HTTP por separado. El código es lo único que
          # distingue "no revisó" de "revisó y no encontró nada", y antes se
          # tiraba a la basura.
          pedir_review() {
            curl -sS -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d @/tmp/request.json \
              -o /tmp/response.json \
              -w '%{http_code}'
          }

          CODIGO=$(pedir_review || true)
          if [ -z "$CODIGO" ]; then CODIGO="000"; fi

          # El free tier tiene dos cuotas: una por ritmo y una por día. La de
          # ritmo se agota sola cuando caen tres PR seguidos, y la API dice
          # cuánto esperar — esa sí se reintenta. La diaria no: reintentar solo
          # gasta un minuto para fallar igual.
          if [ "$CODIGO" = "429" ]; then
            CUOTAS=$(jq -r '[.error.details[]?.violations[]?.quotaId // empty] | join(",")' /tmp/response.json 2>/dev/null || true)
            if printf '%s' "$CUOTAS" | grep -q "PerDay"; then
              echo "::warning::Cuota diaria de Gemini agotada; reintentar no sirve."
            else
              ESPERA=$(jq -r '[.error.details[]? | select((."@type" // "") | test("RetryInfo")) | .retryDelay // empty] | first // "30s"' /tmp/response.json 2>/dev/null || echo "30s")
              ESPERA=${ESPERA%s}
              ESPERA=${ESPERA%.*}
              case "$ESPERA" in ""|*[!0-9]*) ESPERA=30 ;; esac
              if [ "$ESPERA" -gt 120 ]; then ESPERA=120; fi
              echo "::warning::Gemini respondió 429 por cuota de ritmo. Reintento en $((ESPERA + 2))s."
              sleep $((ESPERA + 2))
              CODIGO=$(pedir_review || true)
              if [ -z "$CODIGO" ]; then CODIGO="000"; fi
            fi
          fi

          REVIEW=$(jq -r '.candidates[0].content.parts[0].text // empty' /tmp/response.json 2>/dev/null || true)
          FIN=$(jq -r '.candidates[0].finishReason // empty' /tmp/response.json 2>/dev/null || true)

          if [ -n "$REVIEW" ]; then
            printf '%s\n' "$REVIEW" > /tmp/review.txt
            # Truncado es media revisión: se avisa, pero no se rompe.
            if [ "$FIN" = "MAX_TOKENS" ]; then
              {
                echo ""
                echo "> ⚠️ **El review quedó cortado** al llegar al tope de tokens."
                echo "> Lo que viene después del corte no se revisó."
              } >> /tmp/review.txt
              echo "::warning::Review truncado (finishReason=MAX_TOKENS)."
            fi
            echo "estado=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No hubo review. Que se vea: un PR sin revisar no puede quedar igual
          # que uno revisado y aprobado.
          MOTIVO=$(jq -r '.error.message // .promptFeedback.blockReason // "sin detalle"' /tmp/response.json 2>/dev/null || echo "respuesta ilegible")
          {
            echo "**No se generó review.** El check queda en rojo a propósito: un PR"
            echo "sin revisar no puede verse igual que uno revisado y aprobado."
            echo ""
            echo "- **HTTP:** \`${CODIGO}\`"
            echo "- **Motivo:** ${MOTIVO}"
            echo ""
            echo "Si es la cuota diaria del free tier no hay nada que arreglar en el"
            echo "código: se espera al reset, o se activa billing y se sube"
            echo "\`GEMINI_MODEL\`. **El merge no está bloqueado** — el único check"
            echo "requerido en \`staging\` es \`Tests\`."
          } > /tmp/review.txt
          echo "estado=fallo" >> "$GITHUB_OUTPUT"
          echo "::error::Gemini no generó review (HTTP ${CODIGO}): ${MOTIVO}"

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build comment file to avoid shell escaping issues
          {
            echo "## 🤖 Gemini Code Review"
            echo ""
            cat /tmp/review.txt
            echo ""
            echo "---"
            echo "*Automated review by ${GEMINI_MODEL}*"
          } > /tmp/comment.md

          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      # Ultimo, no primero: asi el comentario con el motivo ya esta puesto en el
      # PR cuando el check se pone rojo.
      - name: Sin review, el check queda rojo
        if: steps.gemini.outputs.estado == 'fallo'
        run: |
          echo "Gemini no generó review. El motivo quedó comentado en el PR."
          exit 1

production:
  clean_empty_pre_alertas:
    class: CleanEmptyPreAlertasJob
    schedule: every day at 3am
  # PR-10.a: DESACTIVADO. Yusef (2026-08-02) confirmó que la tasa de cambio es
  # FIJA y la mete un admin al sistema — no se jala la del día. Con este job
  # activo, floatrates.com le sobrescribía la tasa cada mañana a las 6am.
  # El job se conserva por si algún día vuelven a la tasa automática.
  #
  # actualizar_tasa_cambio:
  #   class: ActualizarTasaCambioJob
  #   schedule: every day at 6am
  marcar_cotizaciones_expiradas:
    class: MarcarCotizacionesExpiradasJob
    schedule: every day at 1am
  marcar_cuotas_vencidas:
    class: MarcarCuotasVencidasJob
    schedule: every day at 1:30am
  # PR-P.2 · El disponible programado (`C30-16`): cada minuto, las
  # pre-facturas que llegaron a su hora pasan a disponible y se le avisa al
  # cliente. Idempotente: el sello es `pre_facturas.notificado_at`.
  #
  # Solo hay sección `production:` y alcanza para staging: el worker de
  # staging en Render (`cec-worker-staging`, `render.yaml`) corre
  # `solid_queue:start` con `RAILS_ENV=production`, igual que el de
  # producción. Cada uno contra su propia base.
  hacer_disponibles_programadas:
    class: HacerDisponiblesProgramadasJob
    schedule: every minute
